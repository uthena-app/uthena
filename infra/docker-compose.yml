# Local container orchestration. Not for production. Production runs
# on Coolify per ADR-0003.
#
# This compose brings up the minimum needed to run the app locally:
#   - app    : the Next.js standalone build
#   - supa   : Supabase (auth, db, storage, realtime) — optional, app
#              runs without it but auth pages will 500.
#
# Stripe / Bunny / PostHog / Gorse / SES are external — not in compose.
# Their keys go in .env.local.

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: uthena-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://supa-kong:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
      - supa-db
    networks: [uthena]
    restart: unless-stopped

  # Supabase local stack — minimal. Use `supabase start` instead for
  # the full stack; this is here for people who want a single command.
  supa-db:
    image: postgres:15-alpine
    container_name: uthena-supa-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - supa-data:/var/lib/postgresql/data
    networks: [uthena]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  uthena:
    driver: bridge

volumes:
  supa-data:
